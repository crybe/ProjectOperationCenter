services:
  tactical-dashboard:
    build: .
    container_name: tactical-dashboard
    restart: unless-stopped
    ports:
      - "5666:5000"
    volumes:
      - .:/app
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
